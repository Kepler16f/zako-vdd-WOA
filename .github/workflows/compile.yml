name: Virtual Display Driver Building
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - sunshine
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - sunshine
jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64, ARM64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Install WDK
        shell: pwsh
        run: |
          # Check if WDK and its VS2022 MSBuild tasks are installed.
          $requiredVsVersion = "17.0"
          $wdkTaskPattern = "C:\Program Files*\Windows Kits\10\build\*\bin\Microsoft.DriverKit.Build.Tasks.$requiredVsVersion.dll"
          $wdfHeader = Get-ChildItem "C:\Program Files*\Windows Kits\10\Include\*\wdf" -Directory -ErrorAction SilentlyContinue |
                       Sort-Object { $_.Parent.Name } -Descending |
                       Select-Object -First 1
          $wdkTask = Get-ChildItem $wdkTaskPattern -ErrorAction SilentlyContinue |
                     Sort-Object { $_.Directory.Parent.Name } -Descending |
                     Select-Object -First 1

          if ($wdfHeader -and $wdkTask) {
            Write-Host "WDK already installed at: $($wdfHeader.FullName)"
            Write-Host "WDK MSBuild task found at: $($wdkTask.FullName)"
          } else {
            Write-Host "Installing WDK..."
            $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2272234"
            $wdkInstaller = "$env:TEMP\wdksetup.exe"
            Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkInstaller -UseBasicParsing
            $proc = Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet", "/norestart", "/features", "+" -Wait -NoNewWindow -PassThru
            Write-Host "WDK installer exit code: $($proc.ExitCode)"
            if ($proc.ExitCode -ne 0) {
              Write-Error "WDK installer failed with exit code $($proc.ExitCode)"
              exit 1
            }
          }

          # Install WDK VSIX for MSBuild integration into the selected VS2022 instance.
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $vswhere = Join-Path $pf86 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found"
            exit 1
          }

          $vsInstall = & $vswhere -products * -requires Microsoft.Component.MSBuild -version "[17.0,18.0)" -property installationPath -latest
          if (-not $vsInstall) {
            Write-Error "Visual Studio 2022 with MSBuild was not found"
            exit 1
          }
          Write-Host "Using Visual Studio: $vsInstall"

          $vsixInstaller = Join-Path $vsInstall "Common7\IDE\VSIXInstaller.exe"
          if (-not (Test-Path $vsixInstaller)) {
            Write-Error "VSIXInstaller.exe not found at $vsixInstaller"
            exit 1
          }

          $vsixFiles = Get-ChildItem "C:\Program Files*\Windows Kits\10\Vsix\*\WDK.vsix" -Recurse -ErrorAction SilentlyContinue
          if (-not $vsixFiles) {
            Write-Error "WDK.vsix not found"
            exit 1
          }

          foreach ($vsix in $vsixFiles) {
            Write-Host "Installing VSIX: $($vsix.FullName)"
            $p = Start-Process -FilePath $vsixInstaller -ArgumentList "/q", $vsix.FullName -Wait -NoNewWindow -PassThru
            Write-Host "VSIX installer exit code: $($p.ExitCode)"
          }

          $wdkTask = Get-ChildItem $wdkTaskPattern -ErrorAction SilentlyContinue |
                     Sort-Object { $_.Directory.Parent.Name } -Descending |
                     Select-Object -First 1
          if (-not $wdkTask) {
            Write-Error "WDK MSBuild task for VS $requiredVsVersion not found ($wdkTaskPattern)"
            exit 1
          }
          Write-Host "Verified WDK MSBuild task: $($wdkTask.FullName)"

      - name: Verify ARM64 toolchain and SDK
        # ARM64 driver builds need (a) the Windows 11 SDK that matches the WDK
        # we just installed (10.0.22621) and (b) the MSVC v143 ARM64 target
        # platform toolset from Visual Studio Build Tools. The windows-2022
        # GitHub-hosted runner ships with an older Windows 10 SDK and only
        # the x64/x86 MSVC components, both of which the WDK installer leaves
        # untouched. Without these, MSBuild fails with MSB8020 (no ARM64
        # build tools) or LNK2019 (unresolved IddCx / WDF symbols) on the
        # ARM64 matrix entry. x64 builds skip this step.
        if: matrix.platform == 'ARM64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # ProgramFiles(x86) has parens and isn't a legal variable name, so
          # resolve it once through .NET instead of $env:ProgramFiles(x86).
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')

          function Get-VisualStudioInstallPath {
            $vswhere = Join-Path $pf86 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (-not (Test-Path $vswhere)) { return $null }
            & $vswhere -products * -requires Microsoft.Component.MSBuild -version '[17.0,18.0)' -property installationPath -latest
          }

          $vsInstall = Get-VisualStudioInstallPath
          if (-not $vsInstall) {
            Write-Error "Visual Studio 2022 with MSBuild was not found. ARM64 build requires it."
            exit 1
          }
          Write-Host "Visual Studio install: $vsInstall"

          $vsInstallerExe = Join-Path $pf86 'Microsoft Visual Studio\Installer\vs_installer.exe'
          if (-not (Test-Path $vsInstallerExe)) {
            Write-Error "vs_installer.exe not found at $vsInstallerExe — cannot add components to Visual Studio."
            exit 1
          }

          # Add the ARM64 MSVC component. This is idempotent — when the
          # component is already present, vs_installer prints a "modify not
          # required" message and exits 0.
          Write-Host "Ensuring VC.Tools.ARM64 component is installed..."
          $vcArm64 = & $vsInstallerExe modify --installPath $vsInstall --quiet --norestart --noUpdate --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 2>&1
          Write-Host "vs_installer modify output: $vcArm64"

          # Confirm the ARM64 MSVC cl.exe and link.exe are now on disk.
          $arm64Cl = Get-ChildItem (Join-Path $vsInstall 'VC\Tools\MSVC\*\bin\Hostx64\arm64\cl.exe') -ErrorAction SilentlyContinue | Select-Object -First 1
          $arm64Link = Get-ChildItem (Join-Path $vsInstall 'VC\Tools\MSVC\*\bin\Hostx64\arm64\link.exe') -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $arm64Cl -or -not $arm64Link) {
            Write-Error "ARM64 MSVC toolset not found under $vsInstall\VC\Tools\MSVC\*\bin\Hostx64\arm64\"
            Write-Error "As a fallback, set up a self-hosted runner with Visual Studio 2022 + the 'Desktop development with C++' workload + ARM64 component."
            exit 1
          }
          Write-Host "ARM64 cl.exe:  $($arm64Cl.FullName)"
          Write-Host "ARM64 link.exe: $($arm64Link.FullName)"

          # Confirm the WDK ARM64 IddCx / WDF libs are present (these come
          # with the WDK installer, not Visual Studio).
          $wdkLib = Get-ChildItem 'C:\Program Files*\Windows Kits\10\Lib\*\um\arm64\iddcx.lib' -ErrorAction SilentlyContinue | Select-Object -First 1
          $wdkInc = Get-ChildItem 'C:\Program Files*\Windows Kits\10\Include\*\um\iddcx.h' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wdkLib) {
            Write-Error "WDK ARM64 iddcx.lib not found under C:\Program Files*\Windows Kits\10\Lib\*\um\arm64\ — the WDK installer did not lay down the ARM64 libraries."
            exit 1
          }
          if (-not $wdkInc) {
            Write-Error "WDK iddcx.h not found under C:\Program Files*\Windows Kits\10\Include\*\um\ — the WDK installer did not lay down the headers."
            exit 1
          }
          Write-Host "WDK ARM64 iddcx.lib: $($wdkLib.FullName)"
          Write-Host "WDK iddcx.h:         $($wdkInc.FullName)"

          # Confirm a Windows SDK that matches the WDK is on the include path.
          $sdk22621 = Get-ChildItem 'C:\Program Files*\Windows Kits\10\Lib\10.0.22621.0\um\arm64\kernel32.lib' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sdk22621) {
            Write-Warning "Windows SDK 10.0.22621.0 not found — the WDK was built against this SDK. Falling back to whatever SDK the WDK installer left behind, which may cause LNK2019 / LNK1120 on ARM64."
            Get-ChildItem 'C:\Program Files*\Windows Kits\10\Lib' -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  Available SDK: $($_.Name)" }
          } else {
            Write-Host "Windows SDK 10.0.22621.0 ARM64 kernel32.lib: $($sdk22621.FullName)"
          }

      - name: Build the driver
        run: |
          # /v:detailed surfaces which arm64 .lib / .h path is missing in the
          # log, in case the build still fails. /clp:NoSummary keeps CI logs
          # readable when x64 succeeds.
          msbuild "ZakoVDD.sln" `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /v:${{ matrix.platform == 'ARM64' && 'detailed' || 'minimal' }} `
            /clp:${{ matrix.platform == 'ARM64' && 'NoSummary;ForceConsoleColor' || 'NoSummary' }}

      - name: Build Vulkan HDR diagnostics
        shell: cmd
        run: |
          call tools\vulkan_hdr_policy_test\build_consumer.bat || exit /b 1
          call tools\vulkan_hdr_probe\build_consumer.bat || exit /b 1
          call tools\vulkan_hdr_bridge\build_consumer.bat || exit /b 1
          call tools\vdd_command\build_consumer.bat || exit /b 1
          call tools\desktop_hdr_capture\build_consumer.bat || exit /b 1
          call tools\vdd_capture_test\build_consumer.bat || exit /b 1

      - name: Stamp driver version and rebuild catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Resolve WDK host tools (x64 build of stampinf/inf2cat, host is x64
          # regardless of the driver platform being built).
          $stampinf = Get-ChildItem "C:\Program Files*\Windows Kits\10\bin\*\x64\stampinf.exe" -ErrorAction SilentlyContinue |
                      Sort-Object { $_.Directory.Parent.Name } -Descending |
                      Select-Object -First 1
          $inf2cat  = Get-ChildItem "C:\Program Files*\Windows Kits\10\bin\*\x64\inf2cat.exe","C:\Program Files*\Windows Kits\10\bin\*\x86\inf2cat.exe" -ErrorAction SilentlyContinue |
                      Sort-Object { $_.Directory.Parent.Name } -Descending |
                      Select-Object -First 1
          if (-not $stampinf) { Write-Error "stampinf.exe not found"; exit 1 }
          if (-not $inf2cat)  { Write-Error "inf2cat.exe not found";  exit 1 }
          Write-Host "Using stampinf: $($stampinf.FullName)"
          Write-Host "Using inf2cat:  $($inf2cat.FullName)"

          $buildDir = "${{ matrix.platform }}\${{ matrix.configuration }}\ZakoVDD"
          $infPath  = Join-Path $buildDir "ZakoVDD.inf"

          # Extract numeric version from tag (e.g. v0.13 -> 100.0.13.0,
          # v0.15.3-zak2333 -> 100.0.15.3) or use date-based version.
          # DriverVer must be numeric dotted-quad. Keep release labels in the
          # Git tag name only; suffixes such as "-zak2333" make Windows unable
          # to parse/display the installed driver version correctly.
          $ref = "${{ github.ref }}"
          if ($ref -match '^refs/tags/v(.+)$') {
            $tagVersion = $Matches[1]
            $numericMatch = [regex]::Match($tagVersion, '^\d+(?:\.\d+){0,3}')
            if (-not $numericMatch.Success) {
              Write-Error "Tag '$tagVersion' does not start with a numeric version"
              exit 1
            }
            $ver = $numericMatch.Value
            # Prefix with 100 to ensure CI builds always outrank local builds
            # v0.13 -> 100.0.13.0, v1.2.3 -> 100.1.2.3
            $parts = $ver.Split('.')
            $parts = @('100') + $parts
            while ($parts.Count -lt 4) { $parts += '0' }
            $version = ($parts[0..3] -join '.')
          } else {
            # Non-tag build: use 99.MM.DD.HHMM to ensure high version
            $now = Get-Date -Format "MM.dd.HHmm"
            $version = "99.$now"
          }

          $date = Get-Date -Format "MM/dd/yyyy"
          Write-Host "Setting DriverVer = $date, $version"

          # Map the matrix platform to the stampinf -a token. Without -a,
          # stampinf defaults to x86, which would corrupt the [Manufacturer]
          # section on an ARM64 build and silently mis-stamp on an x64 build.
          $archToken = switch -Wildcard ("${{ matrix.platform }}") {
            "ARM64" { "arm64" }
            default { "amd64" }
          }
          Write-Host "Using stampinf -a $archToken"

          # Print the [Manufacturer] line BEFORE stamping so the log captures
          # whether MSBuild's infgen pass left $ARCH$ as a literal placeholder
          # or expanded it to the platform-specific section name. This is the
          # most common silent-corruption vector on ARM64 builds.
          Get-Content $infPath | Select-String -Pattern 'Manufacturer|ARCH' | ForEach-Object { Write-Host "  INF pre : $_" }

          & $stampinf.FullName -f $infPath -d $date -v $version -a $archToken
          if ($LASTEXITCODE -ne 0) {
            Write-Error "stampinf failed with exit $LASTEXITCODE — printing the post-stampinf INF for diagnosis"
            Get-Content $infPath | ForEach-Object { Write-Host "  INF post: $_" }
            exit 1
          }
          Get-Content $infPath | Select-String "DriverVer"

          # Rebuild the catalog immediately. stampinf just changed DriverVer,
          # so the MSBuild-generated .cat from the prior step is now stale and
          # would fail catalog verification with "file hash not in the specified
          # catalog file" on install. We always run inf2cat here so the .cat
          # is in lockstep with the INF before any signing step touches it.
          $osList = "10_X64,10_ARM64"
          Write-Host "Rebuilding catalog: $($inf2cat.FullName) /driver:$buildDir /os:$osList"
          & $inf2cat.FullName /driver:"$buildDir" /os:$osList /verbose
          if ($LASTEXITCODE -ne 0) { Write-Error "inf2cat failed: $LASTEXITCODE"; exit 1 }

          # Verify that the freshly built .cat actually hashes to something the
          # INF will resolve to; a missing .cat after inf2cat is the classic
          # cause of the install-time "hash not in catalog" error.
          $catFile = Join-Path $buildDir "zakovdd.cat"
          if (-not (Test-Path $catFile)) {
            Write-Error "Expected catalog file not found: $catFile"
            exit 1
          }
          Write-Host "Rebuilt catalog: $catFile ($((Get-Item $catFile).Length) bytes)"

      - name: List build directory
        continue-on-error: true
        run: dir "${{ matrix.platform }}\${{ matrix.configuration }}\ZakoVDD"

      - name: Sign driver with certificate
        # Catalog signing is always required — without it, the freshly rebuilt
        # .cat from the previous step is unsigned and Windows refuses to install
        # the driver with "file hash not in the specified catalog file". When
        # SIGNING_CERT_PFX is configured we use the release certificate;
        # otherwise we fall back to a per-build self-signed test certificate so
        # PR / development builds still install cleanly with the same .cer.
        shell: pwsh
        env:
          SIGNING_CERT_PFX: ${{ secrets.SIGNING_CERT_PFX }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Locate signtool from WDK. signtool is an x64 host binary, so we
          # always pick the x64 build regardless of the driver platform.
          $signtool = Get-ChildItem "C:\Program Files*\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                      Sort-Object { $_.Directory.Parent.Name } -Descending |
                      Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }
          Write-Host "Using signtool: $($signtool.FullName)"

          $buildDir = "${{ matrix.platform }}\${{ matrix.configuration }}\ZakoVDD"
          $catFile  = Join-Path $buildDir "zakovdd.cat"
          if (-not (Test-Path $catFile)) {
            Write-Error "Catalog $catFile is missing — the previous stampinf + inf2cat step should have created it"
            exit 1
          }

          # Resolve which certificate to use.
          if ($env:SIGNING_CERT_PFX) {
            $pfxBytes = [Convert]::FromBase64String($env:SIGNING_CERT_PFX)
            $pfxPath  = Join-Path $env:TEMP "signcert.pfx"
            [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
            $securePass = ConvertTo-SecureString $env:SIGNING_CERT_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePass
            Remove-Item $pfxPath -Force
            Write-Host "Using PFX signing certificate, thumbprint $($cert.Thumbprint)"
          } else {
            Write-Host "::warning::No SIGNING_CERT_PFX configured — generating a per-build self-signed test certificate. Only use this build for development; production releases should configure a real code-signing certificate."
            $cert = New-SelfSignedCertificate `
              -Subject "CN=ZakoVDD Test Signing (CI), O=Kepler16f" `
              -Type CodeSigningCert `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -KeyUsage DigitalSignature `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -NotAfter (Get-Date).AddDays(365) `
              -KeyExportPolicy Exportable `
              -KeyProtection None
          }

          # Sign the .cat. /tr adds an RFC3161 timestamp that Windows 11 22H2+
          # requires for the modern driver signing model (especially on ARM64);
          # /td SHA256 keeps the timestamp digest consistent with the main
          # /fd SHA256 signature.
          $timestampServer = "http://timestamp.digicert.com"
          Write-Host "Signing $catFile with timestamp $timestampServer"
          & $signtool.FullName sign /sha1 $cert.Thumbprint /fd SHA256 /tr $timestampServer /td SHA256 /v $catFile
          if ($LASTEXITCODE -ne 0) {
            Write-Error "signtool sign failed: $LASTEXITCODE"
            exit 1
          }

          # Verify the signature came back clean so we don't ship a half-signed
          # .cat (the next install attempt would still fail with the same
          # "hash not in catalog" error, but in a much more confusing way).
          Write-Host "Verifying catalog signature..."
          & $signtool.FullName verify /pa /v $catFile
          if ($LASTEXITCODE -ne 0) {
            Write-Error "signtool verify failed: $LASTEXITCODE"
            exit 1
          }

          # Export the .cer users must install into "Trusted Root Certification
          # Authorities" and "Trusted Publishers" before they can install the
          # driver. With a PFX we export the release cert; with a self-signed
          # fallback we export the per-build cert so users get a matching pair.
          $cerPath = Join-Path (Split-Path $buildDir -Parent) "ZakoVDD.cer"
          Export-Certificate -Cert $cert -FilePath $cerPath -Type CERT | Out-Null
          Write-Host "Exported signing certificate to $cerPath"

      - name: Upload built driver
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: Built-Driver-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            ${{ matrix.platform }}\${{ matrix.configuration }}\ZakoVDD\ZakoVDD.dll
            ${{ matrix.platform }}\${{ matrix.configuration }}\ZakoVDD\ZakoVDD.inf
            ${{ matrix.platform }}\${{ matrix.configuration }}\ZakoVDD\zakovdd.cat
            ${{ matrix.platform }}\${{ matrix.configuration }}\ZakoVDD\vdd_settings.xml
            ${{ matrix.platform }}\${{ matrix.configuration }}\ZakoVDD.cer
            tools\vulkan_hdr_bridge\build\zako_vulkan_hdr_bridge.dll
            tools\vulkan_hdr_bridge\build\VkLayer_zako_virtual_hdr.json
            tools\vulkan_hdr_probe\build\vulkan_hdr_probe.exe

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download x64 Release artifact
        uses: actions/download-artifact@v4
        with:
          name: Built-Driver-Release-x64
          path: driver-x64/

      - name: Download ARM64 Release artifact
        uses: actions/download-artifact@v4
        with:
          name: Built-Driver-Release-ARM64
          path: driver-arm64/

      - name: Package release zips (x64 and arm64)
        run: |
          set -e
          # Per-architecture flat zip preserves the historical layout (x64 stays
          # at the top level). Windows on ARM users pick the arm64 zip.
          cd driver-x64
          zip -j ../zakovdd-x64.zip \
            x64/Release/ZakoVDD/ZakoVDD.dll \
            x64/Release/ZakoVDD/ZakoVDD.inf \
            x64/Release/ZakoVDD/zakovdd.cat \
            x64/Release/ZakoVDD/vdd_settings.xml \
            x64/Release/ZakoVDD.cer \
            tools/vulkan_hdr_bridge/build/zako_vulkan_hdr_bridge.dll \
            tools/vulkan_hdr_bridge/build/VkLayer_zako_virtual_hdr.json \
            tools/vulkan_hdr_probe/build/vulkan_hdr_probe.exe
          cd ../driver-arm64
          zip -j ../zakovdd-arm64.zip \
            ARM64/Release/ZakoVDD/ZakoVDD.dll \
            ARM64/Release/ZakoVDD/ZakoVDD.inf \
            ARM64/Release/ZakoVDD/zakovdd.cat \
            ARM64/Release/ZakoVDD/vdd_settings.xml \
            ARM64/Release/ZakoVDD.cer \
            tools/vulkan_hdr_bridge/build/zako_vulkan_hdr_bridge.dll \
            tools/vulkan_hdr_bridge/build/VkLayer_zako_virtual_hdr.json \
            tools/vulkan_hdr_probe/build/vulkan_hdr_probe.exe
          cd ..
          # Combined zip: top-level files for x64 (back-compat) plus an arm64/
          # subfolder for Windows on ARM users.
          cp driver-x64/x64/Release/ZakoVDD/vdd_settings.xml vdd_settings.xml
          zip -j zakovdd.zip \
            driver-x64/x64/Release/ZakoVDD/ZakoVDD.dll \
            driver-x64/x64/Release/ZakoVDD/ZakoVDD.inf \
            driver-x64/x64/Release/ZakoVDD/zakovdd.cat \
            vdd_settings.xml \
            driver-x64/x64/Release/ZakoVDD.cer
          zip -r zakovdd.zip driver-arm64/ARM64/Release/ZakoVDD -x "*.cer"
          rm vdd_settings.xml
          unzip -l zakovdd.zip
          for required in ZakoVDD.dll ZakoVDD.inf zakovdd.cat vdd_settings.xml \
                          arm64/Release/ZakoVDD/ZakoVDD.dll arm64/Release/ZakoVDD/ZakoVDD.inf; do
            unzip -l zakovdd.zip "$required" >/dev/null
          done
          ls -la zakovdd.zip zakovdd-x64.zip zakovdd-arm64.zip
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            zakovdd.zip
            zakovdd-x64.zip
            zakovdd-arm64.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

      - name: Notify Sunshine to update VDD version
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SUNSHINE_DISPATCH_TOKEN }}
          repository: qiin2333/foundation-sunshine
          event-type: driver-release
          client-payload: '{"component": "vdd", "version": "${{ github.ref_name }}"}'
